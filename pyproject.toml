[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpa-filler"
version = "0.2.0"
description = "Automatização de LPAs (Listado de Puntos Abiertos) para avaliações ISA ferroviárias"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.0"]
exe = ["pyinstaller>=6.0"]

[project.scripts]
lpa-filler = "lpa_filler.cli:main"

[project.gui-scripts]
# Abre a janela sem consola por trás (no Windows, gera um .exe sem terminal).
lpa-filler-gui = "lpa_filler.gui:main"

[tool.setuptools]
packages = ["lpa_filler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
