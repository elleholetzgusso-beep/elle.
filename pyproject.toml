[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-pastas"
version = "1.0.0"
description = "Programa para criar e organizar pastas (modelos, projetos de obra e arrumacao de arquivos)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pastas", "organizacao", "arquivos", "cli"]

[project.scripts]
organizador = "organizador.cli:main"

[tool.setuptools]
packages = ["organizador"]
